hardware_profile: high_memory
api_host: 127.0.0.1
api_port: 8420
model:
  name: AnkaLM-4B
  profile: balanced_4b
  arch_version: '2.0'
  model_family: balanced_4b
  vocab_size: 8192
  n_layers: 28
  d_model: 3072
  d_ff: 10240
  n_heads: 24
  n_kv_heads: 8
  max_seq_len: 4096
  dropout: 0.0
  activation: swiglu
  norm_type: rmsnorm
  norm_eps: 1.0e-05
  pos_encoding: rope
  rope_theta: 100000.0
  rope_scaling_factor: 1.0
  tie_word_embeddings: true
  init_std: 0.02
  use_moe: false
training:
  batch_size: 4
  grad_accum_steps: 8
  max_steps: 5000
  warmup_steps: 250
  learning_rate: 0.0004
  min_lr: 4.0e-05
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  precision: bf16
  optimizer_type: adamw_8bit
  eval_interval: 200
  checkpoint_interval: 500
  log_interval: 10
  activation_checkpointing: true
  pack_sequences: true
  seed: 42
