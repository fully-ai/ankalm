hardware_profile: auto
api_host: 127.0.0.1
api_port: 8420
model:
  name: AnkaLM-MoE
  profile: moe
  arch_version: '2.0'
  model_family: moe
  vocab_size: 8192
  n_layers: 6
  d_model: 256
  d_ff: 512
  n_heads: 4
  n_kv_heads: 2
  max_seq_len: 256
  dropout: 0.03
  activation: swiglu
  norm_type: rmsnorm
  norm_eps: 1.0e-05
  pos_encoding: rope
  rope_theta: 10000.0
  tie_word_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 4
  top_k_experts: 2
  use_shared_expert: true
  moe_capacity_factor: 1.25
  moe_aux_loss_coef: 0.02
  moe_z_loss_coef: 0.001
training:
  batch_size: 16
  grad_accum_steps: 1
  max_steps: 140
  warmup_steps: 15
  learning_rate: 0.0009
  min_lr: 9.0e-05
  weight_decay: 0.06
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  precision: bf16
  optimizer_type: adamw
  eval_interval: 35
  checkpoint_interval: 70
  log_interval: 10
  activation_checkpointing: false
  pack_sequences: true
  seed: 42
