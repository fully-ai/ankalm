[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ankalm"
version = "0.1.0"
description = "AnkaLM: Zero-to-Trained Independent Turkish Language Model, Multimodal Document/Vision Engine, Hybrid RAG and Local AI Ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AnkaLM Autonomous AI Research Lab"}
]
dependencies = [
    "torch>=2.1.0",
    "tokenizers>=0.15.0",
    "sentencepiece>=0.1.99",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pyarrow>=14.0.0",
    "pypdf>=4.0.0",
]

[project.scripts]
ankalm = "ankalm.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ankalm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
